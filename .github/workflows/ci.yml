name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# No shell-specific syntax anywhere in this file. Every check is a script in
# ci/, so it runs identically on PowerShell and bash and can be run by hand.
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    env:
      DL_HOME: ${{ github.workspace }}/.dl_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (without the optional embedding model)
        run: |
          python -m pip install --upgrade pip
          pip install flask duckdb pandas requests datasketch scikit-learn numpy pymupdf

      - name: Fixture — the eight ground-truth checks
        run: python ci/check_fixture.py

      - name: Fixture again, under a legacy console encoding
        # The Windows console defaults to cp1252, which cannot encode an arrow.
        # Forcing it means a non-ASCII character in a progress line fails here
        # rather than on a user's terminal.
        env:
          PYTHONIOENCODING: cp1252
          DL_HOME: ${{ github.workspace }}/.dl_ci_cp1252
        run: python -m docketlab fixture

      - name: Adversarial and scaling suite
        env:
          DL_HOME: ${{ github.workspace }}/.dl_ci_stress
        run: python stress.py

      - name: Routes render, including the not-ready states
        env:
          DL_HOME: ${{ github.workspace }}/.dl_ci_routes
        run: python ci/check_routes.py
